<!doctype html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        >
        <meta
            name="color-scheme"
            content="dark light"
        >

        <title>{% block title %}Atlasyr{% endblock %}</title>

        <link
            rel="stylesheet"
            href="{{ app_css_url }}"
        >
        <link
            rel="stylesheet"
            href="{{ plain_css_url }}"
        >

        <script
            src="{{ htmx_js_url }}"
            defer
        ></script>
        <script
            src="{{ bootstrap_js_url }}"
            defer
        ></script>
    </head>

    <body>
        <nav
            class="navbar navbar-expand border-bottom bg-body-tertiary"
            aria-label="Primary navigation"
        >
            <div class="container">
                <a
                    class="navbar-brand fw-semibold"
                    href="/"
                >
                    Atlasyr
                </a>

                <div class="d-flex align-items-center gap-3">
                    <a
                        class="nav-link"
                        href="/"
                        aria-current="page"
                    >
                        Home
                    </a>

                    <a
                        class="btn btn-primary btn-sm"
                        href="/login"
                    >
                        Sign in
                    </a>
                </div>
            </div>
        </nav>

        {% block content %}{% endblock %}
    </body>
</html>
